name: Banking PySpark Lab
on:
  push:
    paths:
      - "interview_lab/**"
      - ".github/workflows/banking_pyspark_lab.yml"
  pull_request:
    paths:
      - "interview_lab/**"
      - ".github/workflows/banking_pyspark_lab.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r interview_lab/requirements-core.txt
      - name: Test PySpark transforms
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
        run: python -m pytest -q interview_lab/tests
