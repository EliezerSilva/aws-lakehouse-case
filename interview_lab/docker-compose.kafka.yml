name: banking-kafka-lab

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Kafka advertises localhost:9092 to the Mac. Sharing its network namespace
  # lets the UI use that same broker address without changing/recreating Kafka,
  # which would discard existing topic messages in this ephemeral lab.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    network_mode: "service:kafka"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: "banking-lab"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "localhost:9092"
      DYNAMIC_CONFIG_ENABLED: "false"

  # Separate local-only gateway for the UI; the Kafka service is untouched.
  kafka-ui-proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./kafka/ui-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kafka-ui
