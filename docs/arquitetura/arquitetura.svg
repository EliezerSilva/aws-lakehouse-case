<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="1142.0" y="856.2">Step Functions</tspan><tspan x="1142.0" y="871.8000000000001">e EventBridge</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="1339.0" y="856.2">Catálogo e governança</tspan><tspan x="1339.0" y="871.8000000000001">(Unity Catalog)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="1526.0" y="856.2">Glue Data Catalog</tspan><tspan x="1526.0" y="871.8000000000001">e Lake Formation</tspan></text>
<text text-anchor="start" dominant-baseline="central" font-size="20" fill="#263c54" font-weight="bold"><tspan x="84" y="968.0">Método de execução por gates (arena-skill), usado nos dois projetos</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="196.5" y="1013.4">1 Pesquisa</tspan><tspan x="196.5" y="1032.6">(somente leitura)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="455.5" y="1023.0">2 Plano</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="714.5" y="1013.4">3 Especificação e</tspan><tspan x="714.5" y="1032.6">critérios de aceite</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="973.5" y="1013.4">4 Implementação</tspan><tspan x="973.5" y="1032.6">com guardas</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1232.5" y="1013.4">5 Validação</tspan><tspan x="1232.5" y="1032.6">com evidência</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1491.5" y="1013.4">6 PR com CI</tspan><tspan x="1491.5" y="1032.6">verde e merge</tspan></text>
<text text-anchor="start" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="172" y="1092.0">verde = validado neste repositório</tspan></text>
