<text text-anchor="start" dominant-baseline="central" font-size="33" fill="#19344b" font-weight="bold"><tspan x="84" y="50.0">aws-lakehouse-case</tspan></text>
<text text-anchor="start" dominant-baseline="central" font-size="20" fill="#263c54" font-weight="bold"><tspan x="84" y="103.0">Implementado e validado: PySpark local com publicação no Amazon S3</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="199.0" y="157.4">Fontes sintéticas</tspan><tspan x="199.0" y="176.6">10 arquivos (1 processado)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="430.0" y="157.4">Bronze</tspan><tspan x="430.0" y="176.6">202 registros</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="618.0" y="159.2">Regras da</tspan><tspan x="618.0" y="174.79999999999998">Silver</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="806.0" y="157.4">Silver</tspan><tspan x="806.0" y="176.6">199 registros</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1047.0" y="157.4">Gold: receita diária</tspan><tspan x="1047.0" y="176.6">por loja (144)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1358.0" y="157.4">Parquet no Amazon S3</tspan><tspan x="1358.0" y="176.6">(us-east-2, por execução)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#70819d"><tspan x="707.0" y="147.0">válido</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="620.0" y="272.4">Quarentena: 3 registros</tspan><tspan x="620.0" y="291.59999999999997">(1 valor negativo, 2 duplicidades)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#d94c4c"><tspan x="654.0" y="235.0">inválido</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="404.0" y="370.4">Estudo NYC TLC (dados públicos): Bronze 3.724.889, Silver 3.724.888,</tspan><tspan x="404.0" y="389.59999999999997">Quarentena 1, Gold 7.551</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="940.0" y="370.4">Testes automatizados da Silver</tspan><tspan x="940.0" y="389.59999999999997">(3 do laboratório, 2 do NYC TLC)</tspan></text>
<text text-anchor="start" dominant-baseline="central" font-size="20" fill="#263c54" font-weight="bold"><tspan x="84" y="468.0">AWS gerenciado: scripts prontos, execução pendente por restrição da conta</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="200.0" y="532.0">Glue job Bronze</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="468.0" y="522.4">Glue job Silver</tspan><tspan x="468.0" y="541.6">e quarentena</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="736.0" y="532.0">Glue job Gold</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1004.0" y="532.0">Glue Data Catalog</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1272.0" y="532.0">Amazon Athena</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="284.0" y="616.0">Step Functions (orquestração)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="720.0" y="616.0">Lake Formation (governança)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="16" fill="#263c54"><tspan x="1156.0" y="616.0">Apache Iceberg (escrita transacional)</tspan></text>
<text text-anchor="start" dominant-baseline="central" font-size="20" fill="#263c54" font-weight="bold"><tspan x="84" y="700.0">Padrões comprovados no dbt-databricks-lakehouse-case e equivalência AWS proposta</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="187.0" y="760.2">Contrato de dados</tspan><tspan x="187.0" y="775.8000000000001">(schema e contract enforced)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="374.0" y="760.2">dbt-athena e</tspan><tspan x="374.0" y="775.8000000000001">Glue Data Quality</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="571.0" y="760.2">Quarentena com ciclo de vida</tspan><tspan x="571.0" y="775.8000000000001">(eventos append-only)</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="758.0" y="760.2">Iceberg no S3</tspan><tspan x="758.0" y="775.8000000000001">consultado no Athena</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="955.0" y="760.2">Reconciliação EXCEPT ALL</tspan><tspan x="955.0" y="775.8000000000001">com o legado</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="1142.0" y="768.0">SQL no Athena</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="1339.0" y="760.2">Federação com</tspan><tspan x="1339.0" y="775.8000000000001">Postgres legado</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="1526.0" y="760.2">Athena Federated</tspan><tspan x="1526.0" y="775.8000000000001">Query</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="187.0" y="856.2">Agente de quarentena com LLM</tspan><tspan x="187.0" y="871.8000000000001">(somente leitura)</tspan></text>
