<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="571.0" y="856.2">CI com testes e</tspan><tspan x="571.0" y="871.8000000000001">branch protegida</tspan></text>
<text text-anchor="middle" dominant-baseline="central" font-size="13" fill="#263c54"><tspan x="758.0" y="856.2">GitHub Actions</tspan><tspan x="758.0" y="871.8000000000001">com OIDC na AWS</tspan></text>
